name: CI
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "examples/**", "config/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "examples/**", "config/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --doc --all-features
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature: ["", "bedrock", "vertex", "opentelemetry"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ matrix.feature }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --locked --no-default-features --features '${{ matrix.feature }}' --all-targets
  portability:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked --all-features --all-targets
