[package]
name = "llm-unify"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A native, asynchronous Rust SDK for multiple LLM providers"
readme = "README.md"

[workspace]
members = [".", "crates/engine", "crates/proxy", "crates/storage"]
default-members = ["."]
exclude = ["vendor/litellm/litellm-rust"]
resolver = "3"

[features]
default = []
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]
vertex = ["dep:google-cloud-auth"]
opentelemetry = ["dep:opentelemetry"]
gateway = ["dep:axum", "dep:rusqlite", "dep:subtle", "dep:uuid", "tokio/net", "tokio/signal", "tokio/rt-multi-thread"]

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
eventsource-stream = "0.2"
futures-core = "0.3"
futures-util = "0.3"
httpdate = "1"
http = "1"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
toml = "1"
aws-config = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1.151", optional = true }
aws-smithy-types = { version = "1", optional = true }
google-cloud-auth = { version = "1", optional = true }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace", "metrics"] }
axum = { version = "0.8", optional = true }
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
subtle = { version = "2", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "net", "io-util"] }
wiremock = "0.6"
static_assertions = "1"
aws-smithy-eventstream = "0.61.6"
tempfile = "3"

[[test]]
name = "contract"
path = "tests/contract/mod.rs"

[[bin]]
name = "llm-unify-gateway"
path = "src/bin/gateway.rs"
required-features = ["gateway"]

