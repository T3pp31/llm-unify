[package]
name = "llm-unify-engine"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/T3pp31/llm-unify"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
llm-unify-storage = { path = "../storage" }
litellm-config = { path = "../../vendor/litellm/litellm-rust/crates/config" }
litellm-gateway = { path = "../../vendor/litellm/litellm-rust/crates/gateway" }
litellm-gateway-auth = { path = "../../vendor/litellm/litellm-rust/crates/gateway-auth" }
litellm-gateway-inference = { path = "../../vendor/litellm/litellm-rust/crates/gateway-inference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["time"] }
async-stream = "0.3"
litellm-framer = { path = "../../vendor/litellm/litellm-rust/crates/framer", default-features = false, features = ["sse"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
