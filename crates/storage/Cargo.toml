[package]
name = "llm-unify-storage"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/T3pp31/llm-unify"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true, features = ["migrate"] }
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "postgres"
path = "tests/postgres.rs"

[[test]]
name = "redis"
path = "tests/redis.rs"
